<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- 登入畫面 -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 bg-opacity-75 flex items-center justify-center z-50 p-4">

            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-900">Whisky Event Tracker</h1>
                <p class="text-sm text-slate-500 mt-1">請輸入密碼與您的名稱以開始使用</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">系統密碼 (Password)</label>
                    <input type="password" id="login-password" placeholder="請輸入密碼" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-600 text-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">使用者名稱 (Username)</label>
                    <input type="text" id="login-username" placeholder="例如: John" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-600 text-lg">
                </div>
                <div id="login-error" class="text-red-600 text-sm hidden font-medium text-center"></div>
                <button onclick="handleLogin()" class="w-full custom-red text-white font-semibold py-3 rounded-xl transition duration-200 text-lg shadow-lg">
                    進入系統 (Enter System)
                </button>
            </div>
        </div>
    </div>

    <!-- 主介面 -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- 頂部導航欄 -->
        <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center gap-3">
                    <h1 class="text-xl sm:text-2xl font-bold text-custom-red tracking-tight">Whisky Sales</h1>
                    <div class="flex bg-slate-100 p-1 rounded-lg">
                        <button onclick="setLanguage('en')" id="lang-en" class="px-3 py-1 rounded-md text-sm font-semibold transition">EN</button>
                        <button onclick="setLanguage('zh')" id="lang-zh" class="px-3 py-1 rounded-md text-sm font-semibold transition">中文</button>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div class="text-sm bg-red-50 text-red-800 px-3 py-1.5 rounded-full font-medium border border-red-200">
                        👤 <span id="current-user-display"></span>
                    </div>
                    <button onclick="handleLogout()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold px-3 py-1.5 rounded-lg transition">
                        登出
                    </button>
                    <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow-sm flex items-center gap-1.5">
                        📊 導出 Excel 報告
                    </button>
                </div>
            </div>
        </header>

        <!-- 搜尋與篩選區 -->
        <div class="bg-white border-b border-slate-200 shadow-sm py-4">
            <div class="max-w-7xl mx-auto px-4 space-y-3">
                <!-- 搜尋欄 -->
                <div class="relative">
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="搜尋產品編號 (Code) 或名稱..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-600 text-base">
                    <span class="absolute left-3.5 top-3 text-slate-400">🔍</span>
                </div>

                <!-- 國家篩選 (按鈕組) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">國家 (Country)</label>
                    <div id="country-pills" class="flex flex-wrap gap-2">
                        <!-- 動態生成國家按鈕 -->
                    </div>
                </div>

                <!-- 品牌篩選 (按鈕組) -->
                <div id="brand-container" class="hidden">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">品牌 (Brand)</label>
                    <div id="brand-pills" class="flex flex-wrap gap-2">
                        <!-- 動態生成品牌按鈕 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 產品清單列表 -->
        <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 動態載入產品 -->
            </div>
        </main>
    </div>

    <!-- 產品詳細與操作 Modal -->
    <div id="action-modal" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-start mb-4 border-b pb-3">
                <div>
                    <span id="modal-code" class="text-xs font-bold text-red-700 bg-red-50 px-2 py-0.5 rounded"></span>
                    <h3 id="modal-title" class="text-lg font-bold text-slate-900 mt-1">產品名稱</h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">&times;</button>
            </div>

            <!-- 售價資訊 -->
            <div class="grid grid-cols-2 gap-3 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm">
                <div>
                    <span class="text-slate-500 block text-xs">單杯金額:</span>
                    <span id="modal-glass-price" class="font-bold text-base text-slate-900"></span>
                </div>
                <div>
                    <span class="text-slate-500 block text-xs">整支金額:</span>
                    <span id="modal-bottle-price" class="font-bold text-base text-slate-900"></span>
                </div>
            </div>

            <!-- 操作按鈕 -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="recordTransaction('glass')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center text-base">
                    🍷 賣出一杯 (Glass)
                </button>
                <button onclick="recordTransaction('bottle')" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center text-base">
                    🍾 賣出一支 (Bottle)
                </button>
                <button onclick="recordTransaction('free_glass')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold py-2.5 px-4 rounded-xl border border-amber-300 transition text-center text-sm">
                    🎁 贈送一杯 (Free Glass)
                </button>
                <button onclick="recordTransaction('free_bottle')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold py-2.5 px-4 rounded-xl border border-amber-300 transition text-center text-sm">
                    🎁 贈送一支 (Free Bottle)
                </button>
            </div>

            <!-- 歷史記錄與刪除 -->
            <div class="flex-grow overflow-y-auto border-t pt-3">
                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">此產品交易紀錄 (Transaction History)</h4>
                <div id="modal-history-list" class="space-y-2">
                    <!-- 歷史紀錄項目 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase 配置 (請在此填入你專屬的 Firebase Config)

            db = firebase.firestore();

        // 完整產品清單數據
        const rawProducts = [
            { id: 1, code: "SWAUCTWQT", nameEn: "Auchentoshan Three Wood Single Malt Whisky", nameZh: "歐肯特軒三桶單一麥芽威士忌", country: "Scotland", brand: "Auchentoshan", volume: "15ml", glassPrice: 25, bottlePrice: 410 },

            { id: 12, code: "SMTAKPMQT", nameEn: "Taketsuru Pure Malt Whisky", nameZh: "竹鶴純麥威士忌", country: "Japan", brand: "Nikka", volume: "15ml", glassPrice: 25, bottlePrice: 420 },
            { id: 13, code: "SMYOISMQT", nameEn: "Yoichi Single Malt Whisky", nameZh: "余市單一麥芽威士忌", country: "Japan", brand: "Yoichi", volume: "15ml", glassPrice: 25, bottlePrice: 450 },
            { id: 14, code: "SMYOI10QT", nameEn: "Yoichi 10 Year Old Single Malt Whisky", nameZh: "余市10年單一麥芽威士忌", country: "Japan", brand: "Yoichi", volume: "15ml", glassPrice: 50, bottlePrice: 700 },
            { id: 15, code: "SMMIYSMQT", nameEn: "Miyagikyo Single Malt Whisky", nameZh: "宮城峽單一麥芽威士忌", country: "Japan", brand: "Miyagikyo", volume: "15ml", glassPrice: 25, bottlePrice: 420 },
            { id: 16, code: "SWHIBABW100QT", nameEn: "Hibiki Anniversary Blend Whisky (100th Anniversary)", nameZh: "響週年紀念調和威士忌(100週年)", country: "Japan", brand: "Hibiki", volume: "15ml", glassPrice: 0, bottlePrice: 5300 },
            { id: 17, code: "SWHIBIJHQT", nameEn: "Hibiki Japanese Harmony Whisky", nameZh: "響日本和諧威士忌", country: "Japan", brand: "Hibiki", volume: "15ml", glassPrice: 50, bottlePrice: 680 },
            { id: 18, code: "SWHAKDRQT", nameEn: "The Hakushu Distiller's Reserve Single Malt Whisky", nameZh: "白州單一麥芽威士忌", country: "Japan", brand: "Hakushu", volume: "15ml", glassPrice: 50, bottlePrice: 680 },
            { id: 19, code: "SWTENPMQTGB", nameEn: "Tenjaku Japanese Pure Malt Whisky with Gift Box", nameZh: "天雀日本純麥威士忌禮盒", country: "Japan", brand: "Tenjaku", volume: "15ml", glassPrice: 25, bottlePrice: 350 },
            { id: 20, code: "SMKAVSOSCSQT", nameEn: "Kavalan Solist Oloroso Sherry Single Cask Strength Single Malt Whisky", nameZh: "噶瑪蘭經典獨奏Oloroso雪莉桶原酒單一麥芽威士忌", country: "Taiwan", brand: "Kavalan", volume: "15ml", glassPrice: 75, bottlePrice: 1080 },
            { id: 21, code: "SMKAVSVBSCSQT", nameEn: "Kavalan Solist Vinho Barrique Cask Strength Single Malt Whisky", nameZh: "噶瑪蘭經典獨奏VINHO酒桶威士忌原酒單一麥芽威士忌", country: "Taiwan", brand: "Kavalan", volume: "15ml", glassPrice: 75, bottlePrice: 1170 },
            { id: 22, code: "SMKAV15YOQT", nameEn: "Kavalan 15YO Single Malt Whisky (2025 Edition)", nameZh: "噶瑪蘭15年單一麥芽威士忌(2025版)", country: "Taiwan", brand: "Kavalan", volume: "15ml", glassPrice: 75, bottlePrice: 1180 },
            { id: 23, code: "SWSTARWATFDQT", nameEn: "Starward Two Fold Double Grain Whisky Qt.", nameZh: "星世Two Fold雙穀物威士忌(大號)", country: "Australia", brand: "Starward", volume: "15ml", glassPrice: 25, bottlePrice: 390 },
            { id: 24, code: "SWALFREDHERQT", nameEn: "Alfred Giraud Heritage Whisky Qt.", nameZh: "阿爾弗雷德吉羅德傳承系列威士忌(大號)", country: "France", brand: "Alfred Giraud", volume: "15ml", glassPrice: 100, bottlePrice: 1350 },
            { id: 25, code: "SWALFREDVOYQT", nameEn: "Alfred Giraud Voyage Whisky Qt.", nameZh: "阿爾弗雷德吉羅德遠航系列威士忌(大號)", country: "France", brand: "Alfred Giraud", volume: "15ml", glassPrice: 100, bottlePrice: 1650 }
        ];

        let currentLang = 'en';
        let currentUser = '';
        let selectedCountry = 'ALL';
        let selectedBrand = 'ALL';
        let currentActiveProductId = null;
        let transactionsData = [];

        // 初始化
        window.onload = function() {
            const savedUser = localStorage.getItem('whisky_user');
            if (savedUser) {
                currentUser = savedUser;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                initApp();
            }
        };

        function handleLogin() {
            const pwd = document.getElementById('login-password').value;
            const user = document.getElementById('login-username').value.trim();
            const errEl = document.getElementById('login-error');

            if (pwd !== '9875321') {
                errEl.innerText = '密碼錯誤，請重新輸入';
                errEl.classList.remove('hidden');
                return;
            }
            if (!user) {
                errEl.innerText = '請輸入使用者名稱';
                errEl.classList.remove('hidden');
                return;
            }

            currentUser = user;
            localStorage.setItem('whisky_user', user);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            initApp();
        }

        function handleLogout() {
            localStorage.removeItem('whisky_user');
            currentUser = '';
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-password').value = '';
            document.getElementById('login-username').value = '';
        }

        function initApp() {
            document.getElementById('current-user-display').innerText = currentUser;
            updateLangUI();
            setupFirebaseListener();
            renderCountryPills();
        }

        function setLanguage(lang) {
            currentLang = lang;
            updateLangUI();
            renderProducts();
        }

        function updateLangUI() {
            document.getElementById('lang-en').className = currentLang === 'en' ? 'px-3 py-1 rounded-md text-sm font-semibold bg-white shadow-sm text-custom-red' : 'px-3 py-1 rounded-md text-sm font-semibold text-slate-600';
            document.getElementById('lang-zh').className = currentLang === 'zh' ? 'px-3 py-1 rounded-md text-sm font-semibold bg-white shadow-sm text-custom-red' : 'px-3 py-1 rounded-md text-sm font-semibold text-slate-600';
        }

        function setupFirebaseListener() {
            if (!db) return;
            db.collection("whisky_transactions").onSnapshot((snapshot) => {
                transactionsData = [];
                snapshot.forEach((doc) => {
                    transactionsData.push({ id: doc.id, ...doc.data() });
                });
                renderProducts();
                if (currentActiveProductId !== null) {
                    renderModalHistory(currentActiveProductId);
                }
            }, (error) => {
                console.error("Firebase 連線錯誤: ", error);
            });
        }

        function renderCountryPills() {
            const countries = ['ALL', ...new Set(rawProducts.map(p => p.country))];
            const container = document.getElementById('country-pills');
            container.innerHTML = countries.map(c => `
                <button onclick="selectCountry('${c}')" class="px-4 py-1.5 rounded-full text-sm font-medium transition ${selectedCountry === c ? 'custom-red text-white shadow' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}">
                    ${c === 'ALL' ? (currentLang === 'en' ? 'All Countries' : '全部國家') : c}
                </button>
            `).join('');
            renderBrandPills();
        }

        function selectCountry(country) {
            selectedCountry = country;
            selectedBrand = 'ALL';
            renderCountryPills();
            renderProducts();
        }

        function renderBrandPills() {
            const brandContainer = document.getElementById('brand-container');
            const pillContainer = document.getElementById('brand-pills');

            let filtered = rawProducts;
            if (selectedCountry !== 'ALL') {
                filtered = rawProducts.filter(p => p.country === selectedCountry);
            }

            const brands = ['ALL', ...new Set(filtered.map(p => p.brand))];
            if (brands.length <= 2 && selectedCountry === 'ALL') {
                brandContainer.classList.add('hidden');
                return;
            }

            brandContainer.classList.remove('hidden');
            pillContainer.innerHTML = brands.map(b => `
                <button onclick="selectBrand('${b}')" class="px-3.5 py-1 rounded-full text-xs font-medium transition ${selectedBrand === b ? 'bg-slate-800 text-white shadow' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}">
                    ${b === 'ALL' ? (currentLang === 'en' ? 'All Brands' : '全部品牌') : b}
                </button>
            `).join('');
        }

        function selectBrand(brand) {
            selectedBrand = brand;
            renderBrandPills();
            renderProducts();
        }

        function filterProducts() {
            renderProducts();
        }

        function calculateItemStats(productId) {
            let stats = { glass: 0, bottle: 0, free_glass: 0, free_bottle: 0, revenue: 0 };
            const product = rawProducts.find(p => p.id === productId);

            transactionsData.forEach(tx => {
                if (tx.productId === productId && !tx.isVoided) {
                    if (tx.type === 'glass') {
                        stats.glass += 1;
                        stats.revenue += product.glassPrice;
                    } else if (tx.type === 'bottle') {
                        stats.bottle += 1;
                        stats.revenue += product.bottlePrice;
                    } else if (tx.type === 'free_glass') {
                        stats.free_glass += 1;
                    } else if (tx.type === 'free_bottle') {
                        stats.free_bottle += 1;
                    }
                }
            });
            return stats;
        }

        function renderProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('product-grid');

            let filtered = rawProducts.filter(p => {
                const matchCountry = selectedCountry === 'ALL' || p.country === selectedCountry;
                const matchBrand = selectedBrand === 'ALL' || p.brand === selectedBrand;
                const matchQuery = p.code.toLowerCase().includes(query) || p.nameEn.toLowerCase().includes(query) || p.nameZh.toLowerCase().includes(query);
                return matchCountry && matchBrand && matchQuery;
            });

            grid.innerHTML = filtered.map(p => {
                const stats = calculateItemStats(p.id);
                const displayName = currentLang === 'en' ? p.nameEn : p.nameZh;

                return `
                    <div onclick="openModal(${p.id})" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition cursor-pointer flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xs font-bold text-red-700 bg-red-50 px-2 py-0.5 rounded border border-red-100">${p.code}</span>
                                <span class="text-xs text-slate-400 font-medium">${p.country}</span>
                            </div>
                            <h3 class="font-bold text-slate-900 text-base mb-2 line-clamp-2">${displayName}</h3>
                            <div class="flex gap-4 text-xs text-slate-600 mb-4 bg-slate-50 p-2 rounded-xl">
                                <div>單杯: <strong class="text-slate-900">${p.glassPrice === 0 ? '非賣品' : 'MOP ' + p.glassPrice}</strong></div>
                                <div>整支: <strong class="text-slate-900">MOP ${p.bottlePrice}</strong></div>
                            </div>
                        </div>
                        
                        <div class="border-t pt-3 flex justify-between items-center text-xs">
                            <div class="flex gap-2">
                                <span class="bg-red-50 text-red-700 px-2.5 py-1 rounded-lg font-bold">杯: ${stats.glass}</span>
                                <span class="bg-slate-900 text-white px-2.5 py-1 rounded-lg font-bold">支: ${stats.bottle}</span>
                                ${(stats.free_glass > 0 || stats.free_bottle > 0) ? `<span class="bg-amber-100 text-amber-800 px-2 py-1 rounded-lg font-bold">贈: ${stats.free_glass + stats.free_bottle}</span>` : ''}
                            </div>
                            <div class="font-bold text-emerald-600 text-sm">
                                MOP ${stats.revenue.toLocaleString()}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(productId) {
            currentActiveProductId = productId;
            const product = rawProducts.find(p => p.id === productId);
            document.getElementById('modal-code').innerText = product.code;
            document.getElementById('modal-title').innerText = currentLang === 'en' ? product.nameEn : product.nameZh;
            document.getElementById('modal-glass-price').innerText = product.glassPrice === 0 ? '非賣品' : `MOP ${product.glassPrice}`;
            document.getElementById('modal-bottle-price').innerText = `MOP ${product.bottlePrice}`;

            renderModalHistory(productId);
            document.getElementById('action-modal').classList.remove('hidden');
            document.getElementById('action-modal').classList.add('flex');
        }

        function closeModal() {
            currentActiveProductId = null;
            document.getElementById('action-modal').classList.add('hidden');
            document.getElementById('action-modal').classList.remove('flex');
        }

        async function recordTransaction(type) {
            if (!currentActiveProductId) return;
            const now = new Date();
            const txData = {
                productId: currentActiveProductId,
                type: type,
                user: currentUser,
                date: now.toISOString().split('T')[0],
                time: now.toTimeString().split(' ')[0],
                timestamp: now.getTime(),
                isVoided: false
            };

            if (db) {
                try {
                    await db.collection("whisky_transactions").add(txData);
                } catch (e) {
                    console.error("寫入 Firebase 失敗", e);
                    alert("網絡異常，寫入失敗");
                }
            }
        }

        function renderModalHistory(productId) {
            const listEl = document.getElementById('modal-history-list');
            const productTxs = transactionsData.filter(tx => tx.productId === productId).sort((a, b) => b.timestamp - a.timestamp);

            if (productTxs.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-400 italic">尚無交易紀錄</p>`;
                return;
            }

            const typeMap = {
                glass: '賣出一杯',
                bottle: '賣出一支',
                free_glass: '贈送一杯',
                free_bottle: '贈送一支'
            };

            listEl.innerHTML = productTxs.map(tx => `
                <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border ${tx.isVoided ? 'opacity-50 bg-slate-100 border-dashed' : 'border-slate-200'} text-xs">
                    <div>
                        <div class="font-semibold ${tx.isVoided ? 'line-through text-slate-400' : 'text-slate-800'}">
                            [${typeMap[tx.type] || tx.type}] - 👤 ${tx.user}
                        </div>
                        <div class="text-[10px] text-slate-400">${tx.date} ${tx.time} ${tx.isVoided ? '(已刪除)' : ''}</div>
                    </div>
                    <div>
                        ${!tx.isVoided ? `<button onclick="voidTransaction('${tx.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 font-bold px-2.5 py-1 rounded-lg transition">刪除</button>` : `<span class="text-[10px] text-red-500 font-bold">已作廢</span>`}
                    </div>
                </div>
            `).join('');
        }

        async function voidTransaction(txId) {
            if (!confirm('確定要刪除這筆交易紀錄嗎？系統會保留刪除日誌。')) return;
            if (db) {
                try {
                    await db.collection("whisky_transactions").doc(txId).update({ isVoided: true });
                } catch (e) {
                    console.error("刪除失敗", e);
                }
            }
        }

        function exportExcel() {
            let summaryData = [];
            rawProducts.forEach((p, index) => {
                let stats = { glass: 0, bottle: 0, free_glass: 0, free_bottle: 0, revenue: 0 };
                transactionsData.forEach(tx => {
                    if (tx.productId === p.id && !tx.isVoided) {
                        if (tx.type === 'glass') { stats.glass++; stats.revenue += p.glassPrice; }
                        else if (tx.type === 'bottle') { stats.bottle++; stats.revenue += p.bottlePrice; }
                        else if (tx.type === 'free_glass') { stats.free_glass++; }
                        else if (tx.type === 'free_bottle') { stats.free_bottle++; }
                    }
                });

                summaryData.push({
                    "序號": index + 1,
                    "Code": p.code,
                    "Description-EN": p.nameEn,
                    "詳細": p.nameZh,
                    "單杯提供容量": p.volume,
                    "單杯金額": p.glassPrice === 0 ? "非賣品" : p.glassPrice,
                    "整支價值金額": p.bottlePrice,
                    "售出杯數": stats.glass,
                    "售出支數": stats.bottle,
                    "贈送杯數": stats.free_glass,
                    "贈送支數": stats.free_bottle,
                    "總銷售金額(MOP)": stats.revenue
                });
            });

            let rawDataList = transactionsData.map(tx => {
                const product = rawProducts.find(p => p.id === tx.productId);
                return {
                    "日期": tx.date,
                    "時間": tx.time,
                    "使用者": tx.user,
                    "產品Code": product ? product.code : '',
                    "產品名稱": product ? product.nameZh : '',
                    "交易類型": tx.type,
                    "狀態": tx.isVoided ? "已刪除 (Voided)" : "正常"
                };
            });

            const wb = XLSX.utils.book_new();
            const wsSummary = XLSX.utils.json_to_sheet(summaryData);
            const wsRaw = XLSX.utils.json_to_sheet(rawDataList);

            XLSX.utils.book_append_sheet(wb, wsSummary, "Sales Summary");
            XLSX.utils.book_append_sheet(wb, wsRaw, "Raw Data");

            XLSX.writeFile(wb, `Whisky_Event_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
        }
    </script>
</body>
</html>
